<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Profiles</title>
    <link href="/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d2d6da; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #444; }
        ::-webkit-scrollbar-thumb:hover { background: #adb5bd; }

        /* Sidebar Collapse Styles */
        #sidebar { transition: width 0.3s ease, min-width 0.3s ease; }
        #sidebar.collapsed { width: 68px; min-width: 68px; }
        #sidebar.collapsed .sidebar-hide { display: none !important; }
        #sidebar.collapsed .sidebar-center { justify-content: center !important; }
        #sidebar.collapsed .sidebar-px { padding-left: 0; padding-right: 0; justify-content: center; }
        #sidebar.collapsed #profile-list { padding-left: 8px; padding-right: 8px; }
        #sidebar.collapsed .profile-item { justify-content: center; padding-left: 0; padding-right: 0; }
        #sidebar.collapsed .del-btn { display: none !important; }
        #sidebar.collapsed .profile-name { display: none !important; }
    </style>
</head>
<body class="h-full bg-[#ffffff] dark:bg-[#121212] text-[#1a1a1a] dark:text-[#e0e0e0] font-['Inter',system-ui,sans-serif] text-[14px]">
<script>
    if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
</script>

<div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="w-[270px] min-w-[270px] bg-[#f8f9fa] dark:bg-[#1a1a1a] border-r border-[#eef0f2] dark:border-[#2a2a2a] flex flex-col overflow-hidden">

        <!-- Header -->
        <div class="flex items-center pt-[24px] pb-[16px] px-[20px] sidebar-px justify-between min-h-[70px]">
            <div class="flex items-center gap-[10px] sidebar-hide overflow-hidden whitespace-nowrap">
                <i class="fa-solid fa-braille text-[#2b6cb0] dark:text-[#4f8ef7] text-[24px] shrink-0"></i>
                <span class="text-[20px] font-bold text-[#2b6cb0] dark:text-[#4f8ef7] tracking-[-0.5px]">Olli</span>
            </div>
            <button id="sidebar-toggle" class="text-[#6c757d] dark:text-[#a0a0a0] hover:text-[#1a1a1a] dark:hover:text-[#e0e0e0] transition-colors shrink-0 w-[24px] flex justify-center items-center" title="Toggle Sidebar">
                <i class="fa-solid fa-bars text-[18px]"></i>
            </button>
        </div>

        <!-- Back + label -->
        <div class="pb-[16px] flex px-[20px] sidebar-px">
            <a href="/" class="inline-flex items-center gap-[8px] text-[13px] text-[#6c757d] dark:text-[#a0a0a0] hover:text-[#1a1a1a] dark:hover:text-[#e0e0e0] transition-colors duration-150 w-full sidebar-center" title="Back to Chat">
                <i class="fa-solid fa-arrow-left text-[14px] shrink-0 w-[16px] text-center"></i>
                <span class="sidebar-hide">Back to Chat</span>
            </a>
        </div>

        <!-- Profiles label + add button -->
        <div class="pt-[8px] pb-[12px] flex flex-col gap-[12px] px-[20px] sidebar-px items-center">
            <div class="text-[11px] font-semibold uppercase text-[#6c757d] dark:text-[#a0a0a0] tracking-[0.5px] sidebar-hide w-full">Profiles</div>
            <button id="new-profile-btn"
                class="bg-none text-[#6c757d] dark:text-[#a0a0a0] border-none text-[13px] font-medium cursor-pointer flex items-center gap-[8px] py-[8px] transition-colors duration-150 font-sans hover:text-[#1a1a1a] dark:hover:text-[#e0e0e0] w-full justify-start sidebar-center" title="New Profile">
                <i class="fa-solid fa-plus text-[14px] shrink-0 w-[16px] text-center"></i>
                <span class="sidebar-hide">New Profile</span>
            </button>
        </div>

        <!-- Profile List -->
        <div id="profile-list"
            class="flex-1 overflow-y-auto px-[12px] pb-[12px] flex flex-col gap-[2px]
            [&_.profile-item]:flex [&_.profile-item]:items-center [&_.profile-item]:justify-between [&_.profile-item]:py-[10px] [&_.profile-item]:px-[12px] [&_.profile-item]:cursor-pointer [&_.profile-item]:rounded-[8px] [&_.profile-item]:transition-all [&_.profile-item]:duration-150 [&_.profile-item]:gap-[10px]
            hover:[&_.profile-item]:bg-[#eef0f2] dark:hover:[&_.profile-item]:bg-[#2a2a2a]
            [&_.profile-item.active]:bg-[#ebf4ff] dark:[&_.profile-item.active]:bg-[#1a2b4c]
            [&_.profile-icon]:text-[#adb5bd] dark:[&_.profile-icon]:text-[#777] [&_.profile-icon]:text-[14px] [&_.profile-icon]:w-[16px] [&_.profile-icon]:text-center [&_.profile-icon]:transition-colors [&_.profile-icon]:duration-150
            hover:[&_.profile-item_.profile-icon]:text-[#6c757d] dark:hover:[&_.profile-item_.profile-icon]:text-[#a0a0a0]
            [&_.profile-item.active_.profile-icon]:!text-[#2b6cb0] dark:[&_.profile-item.active_.profile-icon]:!text-[#4f8ef7]
            [&_.profile-name]:flex-1 [&_.profile-name]:whitespace-nowrap [&_.profile-name]:overflow-hidden [&_.profile-name]:text-ellipsis [&_.profile-name]:text-[13px] [&_.profile-name]:font-medium [&_.profile-name]:text-[#6c757d] dark:[&_.profile-name]:text-[#a0a0a0]
            [&_.profile-item.active_.profile-name]:text-[#2b6cb0] dark:[&_.profile-item.active_.profile-name]:text-[#4f8ef7] [&_.profile-item.active_.profile-name]:font-semibold
            [&_.del-btn]:bg-none [&_.del-btn]:border-none [&_.del-btn]:text-[#adb5bd] dark:[&_.del-btn]:text-[#777] [&_.del-btn]:cursor-pointer [&_.del-btn]:text-[12px] [&_.del-btn]:p-[4px] [&_.del-btn]:rounded-[4px] [&_.del-btn]:opacity-0 [&_.del-btn]:transition-all [&_.del-btn]:duration-150 [&_.del-btn]:shrink-0
            hover:[&_.profile-item_.del-btn]:opacity-100 hover:[&_.del-btn]:!text-[#e53e3e] hover:[&_.del-btn]:!bg-[#fee2e2] dark:hover:[&_.del-btn]:!bg-[rgba(229,62,62,0.2)]">
        </div>

        <!-- Theme toggle -->
        <div class="pt-[16px] pb-[20px] border-t border-[#eef0f2] dark:border-[#2a2a2a] px-[20px] sidebar-px flex">
            <button id="theme-toggle"
                class="flex items-center justify-center w-[34px] h-[34px] rounded-[6px] text-[#6c757d] dark:text-[#a0a0a0] bg-transparent border border-transparent cursor-pointer transition-all duration-150 hover:bg-[#eef0f2] dark:hover:bg-[#2a2a2a] hover:text-[#1a1a1a] dark:hover:text-[#e0e0e0] sidebar-center"
                title="Toggle dark mode">
                <i class="fa-solid fa-moon text-[14px]"></i>
            </button>
        </div>
    </aside>

    <!-- Main Editor -->
    <main class="flex-1 flex flex-col overflow-hidden bg-[#ffffff] dark:bg-[#121212]">

        <!-- Header -->
        <div class="flex items-center px-[32px] py-[20px] border-b border-[#eef0f2] dark:border-[#2a2a2a] min-h-[70px]">
            <span id="editor-title" class="text-[16px] font-semibold text-[#1a1a1a] dark:text-[#e0e0e0]">Select or create a profile</span>
        </div>

        <!-- Empty state -->
        <div id="empty-state" class="flex-1 flex items-center justify-center text-[#adb5bd] dark:text-[#777] text-[14px]">
            <div class="text-center flex flex-col items-center gap-[12px]">
                <i class="fa-solid fa-user-gear text-[40px]"></i>
                <p>Select a profile to edit or create a new one</p>
            </div>
        </div>

        <!-- Editor -->
        <div id="editor-area" class="hidden flex-1 flex flex-col p-[32px] gap-[24px] max-w-[720px] w-full overflow-y-auto">

            <div class="flex flex-col gap-[8px]">
                <label class="text-[11px] font-semibold uppercase text-[#6c757d] dark:text-[#a0a0a0] tracking-[0.5px]">Profile Name</label>
                <input id="profile-name" type="text" placeholder="e.g. Code Assistant"
                    class="bg-[#ffffff] dark:bg-[#1a1a1a] border border-[#d2d6da] dark:border-[#333] rounded-[8px] px-[16px] py-[10px] text-[14px] text-[#1a1a1a] dark:text-[#e0e0e0] outline-none transition-all duration-200 placeholder:text-[#adb5bd] dark:placeholder:text-[#777] focus:border-[#2b6cb0] dark:focus:border-[#4f8ef7] focus:shadow-[0_0_0_3px_rgba(43,108,176,0.1)]" />
            </div>

            <div class="flex flex-col gap-[8px] flex-1">
                <label class="text-[11px] font-semibold uppercase text-[#6c757d] dark:text-[#a0a0a0] tracking-[0.5px]">System Prompt</label>
                <textarea id="profile-prompt" placeholder="You are a helpful assistant..."
                    class="flex-1 min-h-[240px] resize-none bg-[#ffffff] dark:bg-[#1a1a1a] border border-[#d2d6da] dark:border-[#333] rounded-[8px] px-[16px] py-[10px] text-[14px] text-[#1a1a1a] dark:text-[#e0e0e0] outline-none transition-all duration-200 placeholder:text-[#adb5bd] dark:placeholder:text-[#777] focus:border-[#2b6cb0] dark:focus:border-[#4f8ef7] focus:shadow-[0_0_0_3px_rgba(43,108,176,0.1)] leading-[1.6]"></textarea>
            </div>

            <div class="flex items-center gap-[16px]">
                <button id="save-btn"
                    class="bg-[#2b6cb0] dark:bg-[#4f8ef7] text-white border-none rounded-[8px] px-[20px] py-[10px] text-[14px] font-medium cursor-pointer transition-all duration-150 shadow-[0_2px_6px_rgba(43,108,176,0.3)] hover:bg-[#3182ce] dark:hover:bg-[#6aa0ff] hover:scale-[1.02] active:scale-[0.98]">
                    Save Profile
                </button>
                <span id="save-msg" class="text-[13px] text-[#2b6cb0] dark:text-[#4f8ef7] opacity-0 transition-opacity duration-300">Saved!</span>
            </div>
        </div>
    </main>
</div>

<script src="/profiles/script.js"></script>
</body>
</html>
