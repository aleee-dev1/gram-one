<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png">
    <title>Chat</title>

    <link href="/output.css" rel="stylesheet">

    <script src="/vendor/css/github-dark.min.css"></script>
    <script src="/vendor/js/highlight.min.js"></script>
    <script src="/vendor/js/marked.min.js"></script>
    <script src="vendor/js/purify.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        /* Minimal custom styles for things standard Tailwind can't easily inline */
        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .hidden {
            display: none !important;
        }

        .fa-select-wrapper::after {
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d2d6da;
            border-radius: 3px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #4d4d4d;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #adb5bd;
        }

        /* Left Sidebar Collapse Styles */
        #sidebar {
            transition: width 0.3s ease, min-width 0.3s ease;
        }

        #sidebar.collapsed {
            width: 68px;
            min-width: 68px;
        }

        #sidebar.collapsed .sidebar-hide {
            display: none !important;
        }

        #sidebar.collapsed .sidebar-center {
            justify-content: center !important;
        }

        #sidebar.collapsed .sidebar-px {
            padding-left: 0;
            padding-right: 0;
            justify-content: center;
        }

        #sidebar.collapsed #conv-list {
            padding-left: 8px;
            padding-right: 8px;
        }

        #sidebar.collapsed .conv-item {
            justify-content: center;
            padding-left: 0;
            padding-right: 0;
        }

        #sidebar.collapsed .conv-delete {
            display: none !important;
        }

        #sidebar.collapsed .conv-title {
            display: none !important;
        }

        /* Right Sidebar Collapse Styles */
        #right-sidebar {
            transition: width 0.3s ease, min-width 0.3s ease, border-width 0.3s ease;
        }

        #right-sidebar.collapsed {
            width: 0 !important;
            min-width: 0 !important;
            border-left-width: 0 !important;
        }

        #right-sidebar.collapsed > * {
            display: none !important;
        }

        /* Dropdown fade in */
        .dropdown-animate {
            animation: fadeInDown 0.15s ease-out forwards;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body
    class="h-full bg-[#f9f9f9] dark:bg-[#242424] text-[#1a1a1a] dark:text-[#e0e0e0] font-['Inter',system-ui,sans-serif] text-[14px]">
    <div id="app" class="flex h-screen overflow-hidden">

        <!-- Left Sidebar -->
        <aside id="sidebar"
            class="w-[270px] min-w-[270px] bg-[#f0f0f0] dark:bg-[#1e1e1e] border-r border-[#eef0f2] dark:border-[#3d3d3d] flex flex-col overflow-hidden">

            <!-- Header -->
            <div id="sidebar-header"
                class="flex items-center pt-[24px] pb-[16px] px-[20px] sidebar-px justify-between min-h-[70px]">
                <div class="flex items-center gap-[10px] sidebar-hide overflow-hidden whitespace-nowrap">
                    <img src="/assets/logo.png" alt="Gram One Logo" class="w-[24px] h-[24px] shrink-0 object-contain" />
                    <span class="text-[20px] font-bold text-[#1a1a1a] dark:text-[#e0e0e0] tracking-[-0.5px]">Gram One</span>
                </div>
                <button id="sidebar-toggle"
                    class="text-[#6c757d] dark:text-[#8b949e] hover:text-[#1a1a1a] dark:hover:text-[#e0e0e0] transition-colors shrink-0 w-[24px] flex justify-center items-center"

            </div>

            <!-- Conversations Section -->

            </div>

            <!-- Dynamic Conv List Wrapper styles -->

                [&_.conv-item]:flex [&_.conv-item]:items-center [&_.conv-item]:justify-between [&_.conv-item]:py-[10px] [&_.conv-item]:px-[12px] [&_.conv-item]:cursor-pointer [&_.conv-item]:rounded-[8px] [&_.conv-item]:transition-all [&_.conv-item]:duration-150 [&_.conv-item]:gap-[10px] 
                hover:[&_.conv-item]:bg-[#eef0f2] dark:hover:[&_.conv-item]:bg-[#2f2f2f] 
                [&_.conv-item.active]:bg-[#eef0f2] dark:[&_.conv-item.active]:bg-[#2f2f2f] 
                [&_.conv-icon]:text-[#adb5bd] dark:[&_.conv-icon]:text-[#6c757d] [&_.conv-icon]:text-[14px] [&_.conv-icon]:w-[16px] [&_.conv-icon]:text-center [&_.conv-icon]:transition-colors [&_.conv-icon]:duration-150
                hover:[&_.conv-item_.conv-icon]:text-[#6c757d] dark:hover:[&_.conv-item_.conv-icon]:text-[#a0a0a0]
                [&_.conv-item.active_.conv-icon]:!text-[#1a1a1a] dark:[&_.conv-item.active_.conv-icon]:!text-[#e0e0e0]
                [&_.conv-title]:flex-1 [&_.conv-title]:whitespace-nowrap [&_.conv-title]:overflow-hidden [&_.conv-title]:text-ellipsis [&_.conv-title]:text-[13px] [&_.conv-title]:font-medium [&_.conv-title]:text-[#6c757d] dark:[&_.conv-title]:text-[#a0a0a0] 
                [&_.conv-item.active_.conv-title]:text-[#1a1a1a] dark:[&_.conv-item.active_.conv-title]:text-[#e0e0e0] [&_.conv-item.active_.conv-title]:font-semibold 
                [&_.conv-delete]:bg-none [&_.conv-delete]:border-none [&_.conv-delete]:text-[#adb5bd] dark:[&_.conv-delete]:text-[#6c757d] [&_.conv-delete]:cursor-pointer [&_.conv-delete]:text-[12px] [&_.conv-delete]:p-[4px] [&_.conv-delete]:rounded-[4px] [&_.conv-delete]:opacity-0 [&_.conv-delete]:transition-all [&_.conv-delete]:duration-150 [&_.conv-delete]:shrink-0 
                hover:[&_.conv-item_.conv-delete]:opacity-100 hover:[&_.conv-delete]:!text-[#e53e3e] hover:[&_.conv-delete]:!bg-[#fee2e2] dark:hover:[&_.conv-delete]:!bg-[rgba(229,62,62,0.2)]">
            </div>

            <!-- Bottom Settings Section -->
            <div

        <!-- Chat Area -->

            <!-- Standard Header (Hidden in empty state) -->

                    Conversation</span>
            </div>

            <!-- Empty State Greeting (Hidden in active chat) -->
            <div id="empty-state"
                class="hidden flex-col items-center justify-center flex-1 w-full max-w-[800px] mx-auto mt-[-10vh]">
                <h1 id="greeting-text"
                    class="text-3xl md:text-[36px] font-['Playfair_Display',serif] text-[#1a1a1a] dark:text-[#e0e0e0] mb-[32px] flex items-center gap-[12px] font-medium tracking-tight">
                    <i class="fa-solid fa-sun text-[#d97757] text-[28px] rotate-180"></i> Good afternoon
                </h1>
            </div>

            <!-- Messages -->
            <div id="messages"
                class="flex-1 overflow-y-auto p-[32px] flex flex-col gap-[28px] 
                [&_.message]:flex [&_.message]:gap-[20px] [&_.message]:max-w-[800px] [&_.message]:mx-auto [&_.message]:w-full 
                [&_.msg-avatar]:w-[32px] [&_.msg-avatar]:h-[32px] [&_.msg-avatar]:rounded-full [&_.msg-avatar]:shrink-0 [&_.msg-avatar]:flex [&_.msg-avatar]:items-center [&_.msg-avatar]:justify-center [&_.msg-avatar]:overflow-hidden [&_.msg-avatar]:shadow-[0_2px_4px_rgba(0,0,0,0.05)] 
                [&_.msg-avatar_img]:w-full [&_.msg-avatar_img]:h-full [&_.msg-avatar_img]:object-cover 
                [&_.msg-avatar.assistant]:bg-[#1a1a1a] dark:[&_.msg-avatar.assistant]:bg-[#e0e0e0] [&_.msg-avatar.assistant]:text-white dark:[&_.msg-avatar.assistant]:text-[#1a1a1a] [&_.msg-avatar.assistant]:text-[14px] 
                [&_.msg-content-wrapper]:flex-1 [&_.msg-content-wrapper]:min-w-0 [&_.msg-content-wrapper]:flex [&_.msg-content-wrapper]:flex-col [&_.msg-content-wrapper]:gap-[6px] 
                [&_.msg-header]:flex [&_.msg-header]:items-baseline [&_.msg-header]:justify-between [&_.msg-header]:w-full
                [&_.msg-author]:text-[14px] [&_.msg-author]:font-semibold [&_.msg-author]:text-[#1a1a1a] dark:[&_.msg-author]:text-[#e0e0e0] 
                [&_.msg-time]:text-[12px] [&_.msg-time]:text-[#adb5bd] dark:[&_.msg-time]:text-[#6c757d] 
                [&_.bubble]:text-[15px] [&_.bubble]:leading-[1.6] [&_.bubble]:text-[#1a1a1a] dark:[&_.bubble]:text-[#e0e0e0] 
                [&_.bubble_p]:mb-[12px] [&_.bubble_p:last-child]:mb-0 
                [&_.bubble_code]:font-['Fira_Code','Cascadia_Code',monospace] [&_.bubble_code]:text-[13.5px] [&_.bubble_code]:text-[#d63384] dark:[&_.bubble_code]:text-[#e0e0e0] 
                [&_.bubble_p>code]:bg-[#f0f0f0] dark:[&_.bubble_p>code]:bg-[#2f2f2f] [&_.bubble_p>code]:border [&_.bubble_p>code]:border-[#eef0f2] dark:[&_.bubble_p>code]:border-[#3d3d3d] [&_.bubble_p>code]:rounded-[4px] [&_.bubble_p>code]:py-[2px] [&_.bubble_p>code]:px-[6px] dark:[&_.bubble_p>code]:text-[#ff79c6] 
                [&_.bubble_ul]:pl-[24px] [&_.bubble_ol]:pl-[24px] [&_.bubble_ul]:my-[12px] [&_.bubble_ol]:my-[12px] [&_.bubble_ul]:list-disc [&_.bubble_ol]:list-decimal 
                [&_.bubble_li]:mb-[6px] 
                [&_.bubble_h1]:mt-[20px] [&_.bubble_h1]:mb-[10px] [&_.bubble_h2]:mt-[20px] [&_.bubble_h2]:mb-[10px] [&_.bubble_h3]:mt-[20px] [&_.bubble_h3]:mb-[10px] [&_.bubble_h1]:text-2xl [&_.bubble_h2]:text-xl [&_.bubble_h3]:text-lg [&_.bubble_h1]:font-bold [&_.bubble_h2]:font-bold [&_.bubble_h3]:font-bold [&_.bubble_h1]:text-[#1a1a1a] dark:[&_.bubble_h1]:text-[#e0e0e0] [&_.bubble_h2]:text-[#1a1a1a] dark:[&_.bubble_h2]:text-[#e0e0e0] [&_.bubble_h3]:text-[#1a1a1a] dark:[&_.bubble_h3]:text-[#e0e0e0] 
                [&_.bubble_blockquote]:border-l-[4px] [&_.bubble_blockquote]:border-[#eef0f2] dark:[&_.bubble_blockquote]:border-[#3d3d3d] [&_.bubble_blockquote]:pl-[16px] [&_.bubble_blockquote]:text-[#6c757d] dark:[&_.bubble_blockquote]:text-[#8b949e] [&_.bubble_blockquote]:my-[14px] 
                [&_.bubble_a]:text-[#1a1a1a] dark:[&_.bubble_a]:text-[#e0e0e0] [&_.bubble_a]:underline hover:[&_.bubble_a]:opacity-80 
                [&_.token-info]:text-[11px] [&_.token-info]:text-[#adb5bd] dark:[&_.token-info]:text-[#6c757d] 
                [&_.message-error]:text-[13px] [&_.message-error]:text-[#e53e3e] [&_.message-error]:mt-[6px] 
                [&_.cursor::after]:content-['▋'] [&_.cursor::after]:animate-[blink_0.7s_step-end_infinite] [&_.cursor::after]:text-[#1a1a1a] dark:[&_.cursor::after]:text-[#e0e0e0] [&_.cursor::after]:ml-[4px]">
            </div>

            <!-- Input Area Redesigned -->
            <div id="input-area-wrap" class="px-[32px] pb-[32px] max-w-[800px] w-full mx-auto relative z-10">
                <div id="input-area"
                    class="flex flex-col bg-[#ffffff] dark:bg-[#2f2f2f] border border-[#d2d6da] dark:border-[#3d3d3d] rounded-[24px] p-[16px] pt-[12px] shadow-[0_6px_20px_rgba(0,0,0,0.03)] dark:shadow-[0_6px_20px_rgba(0,0,0,0.2)] transition-all duration-200 focus-within:border-[#a0a0a0] dark:focus-within:border-[#555]">

                    <textarea id="user-input"
                        class="w-full bg-transparent border-none outline-none resize-none min-h-[44px] max-h-[200px] text-[15px] text-[#1a1a1a] dark:text-[#e0e0e0] placeholder-[#8b949e] dark:placeholder-[#8b949e] leading-[1.5]"
                        placeholder="How can I help you today?" rows="1"></textarea>

                    <div class="flex items-center justify-between mt-[8px]">
                        <!-- Left Action (+) -->
                        <button
                            class="w-[32px] h-[32px] rounded-full flex items-center justify-center text-[#6c757d] dark:text-[#8b949e] hover:text-[#1a1a1a] dark:hover:text-[#e0e0e0] hover:bg-[#eef0f2] dark:hover:bg-[#3d3d3d] transition-colors cursor-pointer"
                            title="Add Attachment">
                            <i class="fa-solid fa-plus text-[16px]"></i>
                        </button>

                        <!-- Right Actions (Dropdowns & Send) -->
                        <div class="flex items-center gap-[12px]">

                            <button id="right-sidebar-toggle"
                                class="w-[32px] h-[32px] rounded-full flex items-center justify-center text-[#6c757d] dark:text-[#8b949e] hover:text-[#1a1a1a] dark:hover:text-[#e0e0e0] hover:bg-[#eef0f2] dark:hover:bg-[#3d3d3d] transition-colors cursor-pointer"
                                title="Toggle Settings">
                                <i class="fa-solid fa-sliders text-[16px]"></i>
                            </button>

                            <!-- Send Button -->
                            <button id="send-btn"
                                class="bg-[#1a1a1a] dark:bg-[#e0e0e0] text-white dark:text-[#1a1a1a] border-none rounded-[10px] w-[32px] h-[32px] flex items-center justify-center text-[13px] cursor-pointer transition-transform duration-150 hover:scale-105 active:scale-[0.95] disabled:opacity-30 disabled:cursor-not-allowed ml-[4px]">
                                <i class="fa-solid fa-arrow-up"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        <!-- Right Sidebar -->
        <aside id="right-sidebar" class="w-[280px] min-w-[280px] bg-[#f0f0f0] dark:bg-[#1e1e1e] border-l border-[#eef0f2] dark:border-[#3d3d3d] flex flex-col overflow-hidden collapsed">
            <!-- Header -->
            <div class="flex items-center justify-between pt-[24px] pb-[16px] px-[20px] min-h-[70px] border-b border-[#eef0f2] dark:border-[#3d3d3d]">
                <span class="text-[16px] font-bold text-[#1a1a1a] dark:text-[#e0e0e0] tracking-[-0.5px]">Chat Settings</span>
                <button id="right-sidebar-close" class="text-[#6c757d] dark:text-[#8b949e] hover:text-[#1a1a1a] dark:hover:text-[#e0e0e0] transition-colors shrink-0 w-[24px] flex justify-center items-center">

            <div class="p-[20px] flex flex-col gap-[24px] overflow-y-auto">
                <!-- Model Section -->

                    <div class="text-[11px] font-semibold text-[#6c757d] dark:text-[#8b949e] mb-[8px] uppercase tracking-[0.5px]">Model</div>
                    <div class="fa-select-wrapper relative w-full after:content-['\f078'] after:absolute after:right-[12px] after:top-1/2 after:-translate-y-1/2 after:pointer-events-none after:text-[11px] after:text-[#6c757d] dark:after:text-[#8b949e] after:transition-colors focus-within:after:text-[#1a1a1a] dark:focus-within:after:text-[#e0e0e0]">
                        <select id="model-select"
                            class="w-full appearance-none bg-[#ffffff] dark:bg-[#2f2f2f] border border-[#eef0f2] dark:border-[#3d3d3d] rounded-[6px] py-[8px] pr-[30px] pl-[12px] font-sans text-[13px] text-[#1a1a1a] dark:text-[#e0e0e0] cursor-pointer outline-none transition-all duration-200 text-ellipsis whitespace-nowrap overflow-hidden hover:not(:disabled):border-[#adb5bd] dark:hover:not(:disabled):border-[#555] focus:border-[#1a1a1a] dark:focus:border-[#6c757d]"
                            title="Select model">
                            <option value="">Loading models...</option>
                        </select>
                    </div>
                </div>

                <!-- Profile Section -->
                <div>
                    <div class="text-[11px] font-semibold text-[#6c757d] dark:text-[#8b949e] mb-[8px] uppercase tracking-[0.5px]">Profile</div>
                    <div class="relative w-full" id="profile-dropdown-container">
                        <button id="profile-dropdown-btn" class="w-full flex items-center justify-between bg-[#ffffff] dark:bg-[#2f2f2f] border border-[#eef0f2] dark:border-[#3d3d3d] rounded-[6px] py-[8px] px-[12px] text-[13px] text-[#1a1a1a] dark:text-[#e0e0e0] font-medium cursor-pointer transition-colors hover:border-[#adb5bd] dark:hover:border-[#555]">

                        </button>
                        <div id="profile-dropdown-menu" class="hidden absolute top-full left-0 right-0 mt-[4px] bg-[#ffffff] dark:bg-[#1e1e1e] border border-[#eef0f2] dark:border-[#3d3d3d] rounded-[8px] shadow-lg z-[100] dropdown-animate overflow-hidden">
                            <div id="profile-list" class="flex flex-col max-h-[200px] overflow-y-auto">
                                <div class="px-3 py-2 text-xs text-gray-400">Loading profiles...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- MCP Section (Collapsible Box) -->
                <div>
                    <button id="mcp-collapse-btn" class="w-full flex items-center justify-between text-[11px] font-semibold text-[#6c757d] dark:text-[#8b949e] uppercase tracking-[0.5px] cursor-pointer hover:text-[#1a1a1a] dark:hover:text-[#e0e0e0] transition-colors mb-[8px]">
                        <span>MCP Servers</span>
                        <i class="fa-solid fa-chevron-up transition-transform" id="mcp-collapse-icon"></i>
                    </button>
                    <div id="mcp-collapse-content" class="bg-[#ffffff] dark:bg-[#2f2f2f] border border-[#eef0f2] dark:border-[#3d3d3d] rounded-[8px] p-[12px] overflow-hidden">
                        <div id="mcp-list" class="flex flex-col gap-[12px] max-h-[300px] overflow-y-auto pr-[4px]">
                            <!-- MCP toggles injected here dynamically -->
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Delete Modal -->
    <div id="delete-modal"
        class="fixed inset-0 bg-black/40 backdrop-blur-[2px] flex items-center justify-center z-[1000] hidden [&:not(.hidden)]:flex">
        <div
            class="bg-[#ffffff] dark:bg-[#242424] border border-[#eef0f2] dark:border-[#3d3d3d] rounded-[8px] p-[28px] max-w-[420px] w-full shadow-[0_10px_25px_rgba(0,0,0,0.1)] dark:shadow-[0_10px_25px_rgba(0,0,0,0.5)]">
            <h3 class="mb-[12px] text-[#1a1a1a] dark:text-[#e0e0e0] font-semibold text-[18px]">Delete Conversation</h3>
            <p class="text-[#6c757d] dark:text-[#8b949e] mb-[28px] leading-[1.5] text-[14px]">Are you sure you want to
                delete this conversation? This action cannot be undone.</p>
            <div class="flex justify-end gap-[12px]">
