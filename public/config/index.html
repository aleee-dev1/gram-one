<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAM ONE - Configuration</title>
    <link href="/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100 w-full max-w-md">
        <h1 class="text-2xl font-semibold mb-6">Provider Configuration</h1>

        <div id="statusMessage" class="hidden mb-4 p-3 rounded text-sm"></div>

        <form id="configForm" class="space-y-4">
            <div>
                <label for="baseUrl" class="block text-sm font-medium text-gray-700 mb-1">Base URL</label>
                <input type="url" id="baseUrl" name="baseUrl" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="https://api.mistral.ai">
            </div>

            <div>
                <label for="apiKey" class="block text-sm font-medium text-gray-700 mb-1">API Key</label>
                <input type="password" id="apiKey" name="apiKey" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter your API key">
            </div>

            <div class="flex space-x-3 pt-4">
                <button type="submit" id="testBtn"
                    class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors font-medium">
                    Test & Save
                </button>
                <a href="/"
                    class="flex-1 bg-gray-100 text-gray-700 text-center px-4 py-2 rounded-md hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors font-medium">
                    Back to Chat
                </a>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const form = document.getElementById("configForm");
            const baseUrlInput = document.getElementById("baseUrl");
            const apiKeyInput = document.getElementById("apiKey");
            const testBtn = document.getElementById("testBtn");
            const statusMessage = document.getElementById("statusMessage");

            // Load existing config
            try {
                const res = await fetch("/api/config");
                if (res.ok) {
                    const config = await res.json();
                    if (config.base_url) baseUrlInput.value = config.base_url;
                    if (config.api_key) apiKeyInput.value = config.api_key;
                }
            } catch (err) {
                console.error("Could not load config", err);
            }

            function showStatus(message, isError) {
                statusMessage.textContent = message;
                statusMessage.className = `mb-4 p-3 rounded text-sm ${isError ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'}`;
                statusMessage.classList.remove("hidden");
            }

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                
                const baseUrl = baseUrlInput.value.trim();
                const apiKey = apiKeyInput.value.trim();
                
                if (!baseUrl || !apiKey) return;

                testBtn.disabled = true;
                testBtn.textContent = "Testing...";
                testBtn.classList.add("opacity-70");
                statusMessage.classList.add("hidden");

                try {
                    const res = await fetch("/api/config", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ baseUrl, apiKey })
                    });
                    
                    const data = await res.json();
                    
                    if (res.ok && data.success) {
                        showStatus("Configuration works and was saved successfully!", false);
                    } else {
                        showStatus(`Error: ${data.error || 'Failed to verify configuration'}`, true);
                    }
                } catch (err) {
                    showStatus(`Network error: ${err.message}`, true);
                } finally {
                    testBtn.disabled = false;
                    testBtn.textContent = "Test & Save";
                    testBtn.classList.remove("opacity-70");
                }
            });
        });
    </script>
</body>
</html>
